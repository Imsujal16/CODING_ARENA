import java.util.Properties

plugins {
    id 'com.android.application'
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { stream ->
        localProperties.load(stream)
    }
}

def quoteString = { value ->
    '"' + value.toString()
            .replace('\\', '\\\\')
            .replace('"', '\\"') + '"'
}

def emulatorBaseUrl = (localProperties.getProperty('arena.emulator.baseUrl')
        ?: 'http://10.0.2.2:3000/').trim()
def deviceBaseUrl = (localProperties.getProperty('arena.device.baseUrl')
        ?: 'http://10.7.15.205:3000/').trim()
def emulatorSocketUrl = (localProperties.getProperty('arena.emulator.socketUrl')
        ?: 'http://10.0.2.2:3001').trim()
def deviceSocketUrl = (localProperties.getProperty('arena.device.socketUrl')
        ?: 'http://10.7.15.205:3001').trim()

android {
    namespace 'com.arena.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.arena.app"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        buildConfigField "String", "EMULATOR_BASE_URL", quoteString(emulatorBaseUrl)
        buildConfigField "String", "DEVICE_BASE_URL", quoteString(deviceBaseUrl)
        buildConfigField "String", "EMULATOR_SOCKET_URL", quoteString(emulatorSocketUrl)
        buildConfigField "String", "DEVICE_SOCKET_URL", quoteString(deviceSocketUrl)
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
        viewBinding true
    }
}

configurations.configureEach {
    resolutionStrategy.force(
            'androidx.core:core:1.13.1',
            'androidx.core:core-ktx:1.13.1',
            'androidx.appcompat:appcompat:1.6.1',
            'androidx.credentials:credentials:1.3.0',
            'androidx.credentials:credentials-play-services-auth:1.3.0',
            'androidx.lifecycle:lifecycle-process:2.7.0',
            'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0',
            'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    )
}

dependencies {
    // AndroidX Core
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.viewpager2:viewpager2:1.0.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    // Material Design 3
    implementation 'com.google.android.material:material:1.11.0'

    // Navigation Component
    implementation 'androidx.navigation:navigation-fragment:2.7.7'
    implementation 'androidx.navigation:navigation-ui:2.7.7'

    // Lifecycle (ViewModel + LiveData)
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-process:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'

    // Room Database
    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'

    // Retrofit + OkHttp + Gson
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    implementation 'com.google.code.gson:gson:2.10.1'

    // Clerk Authentication
    implementation('com.clerk:clerk-android:0.1.4') {
        exclude group: 'androidx.lifecycle'
    }

    // Glide (Image Loading)
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'

    // Lottie Animations
    implementation 'com.airbnb.android:lottie:6.3.0'

    // Socket.IO Client
    implementation('io.socket:socket.io-client:2.1.0') {
        exclude group: 'org.json', module: 'json'
    }

    // Facebook Shimmer (Loading effect)
    implementation 'com.facebook.shimmer:shimmer:0.5.0'

    // CircleImageView
    implementation 'de.hdodenhof:circleimageview:3.1.0'

    // Testing
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
